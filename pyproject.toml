[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dahua-telegram-bridge"
version = "0.1.0"
description = "Low-latency Dahua NVR event to Telegram bridge"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6.0,<7", "aiohttp>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
